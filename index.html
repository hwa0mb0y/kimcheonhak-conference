<style>
  :root{
    --paper:#F1EEE6;
    --ink:#211D17;
    --ink-soft:#5C564C;
    --ink-faint:#8B8577;
    --ochre:#A9824C;
    --rule:#CBC3B2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Serif KR', serif;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{
    max-width:480px;
    text-align:center;
  }
  .seal{
    display:block;
    height:64px;
    width:auto;
    margin:0 auto 32px;
  }
  .rule-double{
    border:none;
    border-top:1px solid var(--ink);
    height:4px;
    border-bottom:1px solid var(--ink);
    margin:0 0 32px;
  }
  .eyebrow{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  h1{
    font-size:26px;
    font-weight:700;
    line-height:1.5;
    margin:0 0 22px;
  }
  .status{
    display:inline-block;
    font-size:14px;
    color:var(--ochre);
    border:1px solid var(--ochre);
    padding:6px 18px;
    margin:0 0 26px;
    letter-spacing:0.02em;
  }
  p{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .date{
    font-size:14px;
    color:var(--ink-faint);
    margin-top:22px;
  }
</style>
